<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midnight Garnet💫</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Midnight Garnet">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg"></div>

<!-- ログイン -->
<section id="login" hidden>
  <div class="login-card">
    <img src="icons/icon-192.png?v=2" class="login-gem" alt="">
    <h1 class="brand">Midnight Garnet<span>💫</span></h1>
    <p class="sub">Progress Board</p>
    <div id="gLogin" hidden>
      <button class="btn gbtn" type="button" id="gBtn">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Googleでログイン
      </button>
    </div>
    <div id="pickBox" hidden>
      <p class="pick-lead">あなたはどなたですか？</p>
      <p class="hint" id="pickEmail"></p>
      <div id="pickList"></div>
      <p class="hint">一度選ぶと、このGoogleアカウントは次回から自動でその名前になります。</p>
    </div>
    <form id="loginForm" autocomplete="off">
      <label>ログインコード
        <input id="code" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="8文字のコード" required>
      </label>
      <button class="btn gem" type="submit">ログイン</button>
    </form>
    <p class="hint" id="demoHint"></p>
  </div>
</section>

<!-- メイン -->
<section id="app" hidden>
  <header class="top">
    <div class="brand sm">Midnight Garnet<span>💫</span></div>
    <div id="meChip"></div>
  </header>
  <main id="view"></main>
  <nav class="tabbar">
    <button data-act="nav" data-view="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>カレンダー</span>
    </button>
    <button data-act="nav" data-view="works">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3a9 9 0 0 1 9 9"/></svg>
      <span>作品</span>
    </button>
    <button class="fab" data-act="new" aria-label="追加"><span>+</span></button>
    <button data-act="nav" data-view="tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 6l1.2 1.2L7 5M4 12l1.2 1.2L7 11M4 18l1.2 1.2L7 17"/></svg>
      <span>タスク</span>
    </button>
    <button data-act="nav" data-view="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>設定</span>
    </button>
  </nav>
  <button id="admBtn" data-act="admin" aria-label="管理"></button>
</section>

<!-- 隠し管理者画面 -->
<section id="admin" class="overlay" hidden>
  <div class="d-head">
    <button class="icon-btn" data-act="adminClose" aria-label="戻る">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h2>管理者画面</h2>
  </div>
  <div id="aBody" class="o-body"></div>
</section>

<!-- アルバム・曲 -->
<section id="proj" class="overlay" hidden>
  <div class="d-head">
    <button class="icon-btn" data-act="projBack" aria-label="戻る">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h2 id="pTitle"></h2>
  </div>
  <div id="pBody" class="o-body"></div>
</section>

<!-- タスク詳細 -->
<section id="detail" class="overlay" hidden>
  <div class="d-head">
    <button class="icon-btn" data-act="back" aria-label="戻る">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h2 id="dTitle"></h2>
  </div>
  <div id="dBody"></div>
  <form id="composer" class="composer">
    <textarea id="msgInput" rows="1" placeholder="メッセージを入力"></textarea>
    <button class="send" type="submit" aria-label="送信">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </button>
  </form>
</section>

<!-- 下から出るフォーム -->
<div id="sheetWrap" hidden>
  <div class="scrim" data-act="closeSheet"></div>
  <div id="sheet" class="sheet"></div>
</div>

<div id="toast"></div>

<script src="config.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
